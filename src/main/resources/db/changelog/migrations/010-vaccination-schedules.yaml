databaseChangeLog:

  - changeSet:
      id: create-vaccination-schedules-table
      author: alexandra
      comment: Create vaccination_schedules table for Greece national vaccination program
      changes:
        - createTable:
            tableName: vaccination_schedules
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: vaccine_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: vaccine_name_gr
                  type: VARCHAR(255)
              - column:
                  name: recommended_age_months
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: dose_number
                  type: INT
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: create-vaccination-schedule-indexes
      author: alexandra
      comment: Create indexes for vaccination_schedules
      changes:
        - createIndex:
            tableName: vaccination_schedules
            indexName: idx_vaccination_schedule_vaccine_age
            columns:
              - column:
                  name: vaccine_name
              - column:
                  name: recommended_age_months
        - createIndex:
            tableName: vaccination_schedules
            indexName: idx_vaccination_schedule_vaccine
            columns:
              - column:
                  name: vaccine_name

  - changeSet:
      id: insert-greece-vaccination-schedule-2026
