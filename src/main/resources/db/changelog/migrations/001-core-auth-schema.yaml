databaseChangeLog:

  - changeSet:
      id: create-users-table
      author: alexandra
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BIT(1)
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE users ADD CONSTRAINT check_user_role CHECK (role IN ('ROLE_DOCTOR','ROLE_PARENT'))
      rollback:
        - dropTable:
            tableName: users

  - changeSet:
      id: create-doctors-table
      author: alexandra
      changes:
        - createTable:
            tableName: doctors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: first_name
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: TEXT
              - column:
                  name: specialization
                  type: VARCHAR(255)
              - column:
                  name: license_number
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
        - addForeignKeyConstraint:
            constraintName: fk_doctors_user
            baseTableName: doctors
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
      rollback:
        - dropTable:
            tableName: doctors

  - changeSet:
      id: create-parents-table
      author: alexandra
      changes:
        - createTable:
            tableName: parents
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: first_name
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: TEXT
              - column:
                  name: address
                  type: TEXT
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
        - addForeignKeyConstraint:
            constraintName: fk_parents_user
            baseTableName: parents
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
      rollback:
        - dropTable:
            tableName: parents
