databaseChangeLog:

  - changeSet:
      id: create-growth-alert-acknowledgements-table
      author: alexandra
      comment: Create table recording doctor acknowledgements of growth alerts
      changes:
        - createTable:
            tableName: growth_alert_acknowledgements
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: child_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: alert_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: acknowledged_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: TEXT
        - addForeignKeyConstraint:
            baseTableName: growth_alert_acknowledgements
            baseColumnNames: child_id
            referencedTableName: children
            referencedColumnNames: id
            constraintName: fk_growth_alert_ack_child
        - addForeignKeyConstraint:
            baseTableName: growth_alert_acknowledgements
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            constraintName: fk_growth_alert_ack_doctor
        - addUniqueConstraint:
            tableName: growth_alert_acknowledgements
            columnNames: child_id,alert_key
            constraintName: uk_growth_alert_ack_child_key