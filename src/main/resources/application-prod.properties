# Production-specific Spring Boot configuration

# Database configuration for Production
spring.datasource.url=${AIVEN_DB_URL}
spring.datasource.username=${AIVEN_DB_USER}
spring.datasource.password=${AIVEN_DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Liquibase - runs migrations on startup
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JPA / Hibernate
# Liquibase handles schema creation, Hibernate validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Encryption key
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Actuator (for Docker health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Server
server.port=8080
server.servlet.context-path=/
