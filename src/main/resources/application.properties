# Database
spring.datasource.url=jdbc:mysql://localhost:3307/child_healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JPA / Hibernate
# Liquibase runs migrations on startup, then Hibernate validates schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:your-256-bit-secret-key-replace-in-production-must-be-at-least-32-chars}
app.jwt.expiration-ms=86400000

# Encryption key: 256-bit AES key, base64-encoded. Generate with:
# openssl rand -base64 32
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Server
server.port=8080

# Springdoc-openapi
springdoc.swagger-ui.tags-sorter=alpha

# CORS / auth cookie
app.cors.allowed-origins=http://localhost:5173,https://healthcare-book-ui.vercel.app
app.auth.cookie.secure=false
