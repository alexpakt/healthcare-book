# Database
spring.datasource.url=jdbc:mysql://localhost:3306/child_healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=your-256-bit-secret-key-replace-in-production-must-be-at-least-32-chars
app.jwt.expiration-ms=86400000

# Encryption key: 256-bit AES key, base64-encoded. Generate with:
# openssl rand -base64 32
# IMPORTANT: Use an environment variable in production: APP_ENCRYPTION_KEY=...
app.encryption.key=your-base64-encoded-256-bit-aes-key-replace-in-production==

# Server
server.port=8080
