# Docker-specific Spring Boot configuration
# Activated with: spring.profiles.active=docker

# Database configuration for Docker Compose
spring.datasource.url=jdbc:mysql://mysql:3307/child_healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:healthcare_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Liquibase - runs migrations on startup
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JPA / Hibernate
# Liquibase handles schema creation, Hibernate validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Encryption key
app.encryption.key=${APP_ENCRYPTION_KEY:}

# HMAC key for the AMKA lookup hash: 256-bit, base64-encoded. Generate with: openssl rand -base64 32
app.amka-hash.key=${APP_AMKA_HASH_KEY:}

# Actuator (for Docker health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Server
server.port=8080
server.servlet.context-path=/

# Springdoc-openapi
springdoc.swagger-ui.tags-sorter=alpha

# CORS / auth cookie (cookie is Secure by default)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://healthcare-book-ui.vercel.app}
app.auth.cookie.secure=false
