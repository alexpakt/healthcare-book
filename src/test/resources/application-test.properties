# Test environment configuration
# Uses H2 in-memory database for fast, isolated tests (no Docker required)

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (optional, for debugging)
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Liquibase - runs migrations on test startup
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT (test values)
app.jwt.secret=test-secret-key-32-characters-minimum-required-by-spring
app.jwt.expiration-ms=3600000

# Encryption key (test value)
app.encryption.key=xtnmEHRRMMHyEH7vzDczfdgmQt10N6tXfkKKPB+Nm5U=

# Actuator
management.endpoints.web.exposure.include=health,info
