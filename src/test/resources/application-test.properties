# Test Database (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# Use test-specific Liquibase changelog
spring.liquibase.change-log=classpath:db/changelog/db.changelog-test.yaml

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT
app.jwt.secret=test-secret-key-must-be-at-least-32-characters-long
app.jwt.expiration-ms=86400000

# Encryption key ffor test environment
app.encryption.key=Ni6DpdUl5NvZpunuVBhH3aXFJpvYE5zlCoJwCvIYcn0=

# Springdoc-openapi
springdoc.swagger-ui.tags-sorter=alpha
