# Test Database (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# Use master Liquibase changelog (shared with production)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT
app.jwt.secret=test-secret-key-must-be-at-least-32-characters-long
app.jwt.expiration-ms=86400000

# Encryption key ffor test environment
app.encryption.key=Ni6DpdUl5NvZpunuVBhH3aXFJpvYE5zlCoJwCvIYcn0=

# HMAC key for AMKA hash in test environment
app.amka-hash.key=Zt0xq2m6Qh1v8Yw3Rk5nLp9sUa7cEd4fGb2JiHoXyVE=

# Springdoc-openapi
springdoc.swagger-ui.tags-sorter=alpha

# CORS / auth cookie
app.cors.allowed-origins=http://localhost:5173
app.auth.cookie.secure=false
