databaseChangeLog:

  - changeSet:
      id: create-growth-measurements-table
      author: alexandra
      changes:
        - createTable:
            tableName: growth_measurements
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: measurement_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: age_in_months
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: height_cm
                  type: DOUBLE
              - column:
                  name: weight_kg
                  type: DOUBLE
              - column:
                  name: head_circumference_cm
                  type: DOUBLE
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: child_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_growth_measurements_child
            baseTableName: growth_measurements
            baseColumnNames: child_id
            referencedTableName: children
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_growth_measurements_doctor
            baseTableName: growth_measurements
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
      rollback:
        - dropTable:
            tableName: growth_measurements