databaseChangeLog:

  - changeSet:
      id: create-birth-records-table
      author: alexandra
      changes:
        - createTable:
            tableName: birth_records
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: birth_weight_grams
                  type: INT
              - column:
                  name: birth_length_cm
                  type: DOUBLE
              - column:
                  name: birth_head_circumference_cm
                  type: DOUBLE
              - column:
                  name: gestational_age_weeks
                  type: INT
              - column:
                  name: delivery_type
                  type: "ENUM('VAGINAL','CESAREAN','VAGINAL_ASSISTED')"
              - column:
                  name: apgar_score_1_min
                  type: INT
              - column:
                  name: apgar_score_5_min
                  type: INT
              - column:
                  name: birth_hospital
                  type: TEXT
              - column:
                  name: nicu_admission
                  type: BIT(1)
              - column:
                  name: nicu_duration_days
                  type: INT
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: child_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
        - addForeignKeyConstraint:
            constraintName: fk_birth_records_child
            baseTableName: birth_records
            baseColumnNames: child_id
            referencedTableName: children
            referencedColumnNames: id
      rollback:
        - dropTable:
            tableName: birth_records